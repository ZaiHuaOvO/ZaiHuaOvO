name: Update activity graph

on:
  schedule:
    # 每天 UTC 21:37（北京时间 05:37）刷新一次
    - cron: '37 21 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate-activity-graph.mjs'
      - '.github/workflows/activity-graph.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成折线图
        run: node scripts/generate-activity-graph.mjs

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-graph.svg
          if git diff --cached --quiet; then
            echo "图表无变化，跳过提交"
          else
            git commit -m "chore: 更新摸鱼折线图"
            git push
          fi
